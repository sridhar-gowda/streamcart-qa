# Local, reproducible execution: the suite in a container, the browser in a Selenium Grid
# container. Same image and same `--target chrome-grid` as the CI service-container job.
#
#   docker compose run --rm tests                       # smoke on Chrome, 2 workers
#   docker compose run --rm tests --suite regression    # any pytest arguments
#   docker compose --profile firefox run --rm tests-firefox
#   open http://localhost:7900 (password: secret) to watch the grid session
#
# Reports land in ./reports on the host; credentials come from ./.env (never the image).

services:
  selenium:
    image: selenium/standalone-chrome:4.27.0
    shm_size: 2g
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  selenium-firefox:
    profiles: ["firefox"]
    image: selenium/standalone-firefox:4.27.0
    shm_size: 2g
    ports:
      - "4445:4444"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      timeout: 5s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      STREAMCART_WEB__REMOTE_URL: http://selenium:4444
      STREAMCART_USERS__DEFAULT__PASSWORD: ${STREAMCART_USERS__DEFAULT__PASSWORD:?set STREAMCART_USERS__DEFAULT__PASSWORD in .env}
      STREAMCART_RUN_ID: ${STREAMCART_RUN_ID:-}
      STREAMCART_ENV: ${STREAMCART_ENV:-dev}
    volumes:
      - ./reports:/app/reports
    command: ["--platform", "web", "--target", "firefox-grid", "--suite", "smoke", "-n", "2", "-ra"]

  tests-firefox:
    profiles: ["firefox"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      selenium-firefox:
        condition: service_healthy
    environment:
      STREAMCART_WEB__REMOTE_URL: http://selenium-firefox:4444
      STREAMCART_USERS__DEFAULT__PASSWORD: ${STREAMCART_USERS__DEFAULT__PASSWORD:?set STREAMCART_USERS__DEFAULT__PASSWORD in .env}
    volumes:
      - ./reports:/app/reports
    command: ["--platform", "web", "--target", "chrome-grid", "--suite", "smoke", "-n", "2", "-ra"]
